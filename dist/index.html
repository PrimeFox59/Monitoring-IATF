    <script id="iatf-demo-autologin">
      (function() {
        try {
          const userStr = localStorage.getItem('user');
          const loginTime = localStorage.getItem('loginTime');
          const now = Date.now();
          const oneWeek = 10080 * 60 * 1000;
          if (!userStr || !loginTime || (now - parseInt(loginTime) >= oneWeek)) {
            const demoUser = {
              id: 'admin',
              full_name: 'GALIH PRIMANANDA',
              department: 'Prod MC',
              section: 'Machining',
              role: 'Admin',
              is_approved: true
            };
            localStorage.setItem('user', JSON.stringify(demoUser));
            localStorage.setItem('loginTime', now.toString());
            console.log('[Demo] Auto-login active as Admin (GALIH PRIMANANDA)');
          }
        } catch (e) {
          console.warn('[Demo] Auto-login init error:', e);
        }

        // Auto-fill and assist if login modal appears
        const observer = new MutationObserver(function() {
          const userInput = document.querySelector('input[name="userId"]');
          const passInput = document.querySelector('input[name="password"]');
          if (userInput && !userInput.value) {
            userInput.value = 'admin';
            userInput.dispatchEvent(new Event('input', { bubbles: true }));
          }
          if (passInput && !passInput.value) {
            passInput.value = 'password';
            passInput.dispatchEvent(new Event('input', { bubbles: true }));
          }
        });
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function() {
            observer.observe(document.body, { childList: true, subtree: true });
          });
        } else {
          observer.observe(document.body, { childList: true, subtree: true });
        }
      })();
    </script>

    <script>
      /* --- 1. WINDOW OPEN USER ATTACHER --- */
      (function() {
        const originalOpen = window.open;
        window.open = function(url, target, features) {
          if (typeof url === 'string' && url.includes('/api/documents/')) {
            try {
              const userStr = localStorage.getItem('user');
              if (userStr) {
                const user = JSON.parse(userStr);
                const userName = user.full_name || user.name || '';
                const userRole = user.role || '';
                if (userName) {
                  const separator = url.includes('?') ? '&' : '?';
                  const params = new URLSearchParams();
                  params.append('user_name', userName);
                  if (userRole) params.append('user_role', userRole);
                  url = url + separator + params.toString();
                }
              }
            } catch (e) {
              console.error('Error attaching user to document URL:', e);
            }
          }
          return originalOpen.call(window, url, target, features);
        };
      })();

      /* --- 2. FLOATING TOAST SYSTEM --- */
      (function() {
        function getContainer() {
          let c = document.getElementById('iatf-toast-container');
          if (!c) {
            c = document.createElement('div');
            c.id = 'iatf-toast-container';
            document.body.appendChild(c);
          }
          return c;
        }

        window.showToast = function(msg, explicitType) {
          if (!msg) return;
          const container = getContainer();
          const strMsg = String(msg);
          let type = explicitType || 'info';
          let title = 'NOTIFIKASI SISTEM';

          const lower = strMsg.toLowerCase();
          if (explicitType === 'success' || (!explicitType && (lower.includes('berhasil') || lower.includes('success') || lower.includes('sukses') || lower.includes('complete') || lower.includes('uploaded')))) {
            type = 'success';
            title = 'BERHASIL';
          } else if (explicitType === 'error' || (!explicitType && (lower.includes('gagal') || lower.includes('failed') || lower.includes('error') || lower.includes('invalid') || lower.includes('salah')))) {
            type = 'error';
            title = 'PERHATIAN / ERROR';
          }

          const toast = document.createElement('div');
          toast.className = `iatf-toast iatf-toast-${type}`;

          let iconSvg = '';
          if (type === 'success') {
            iconSvg = '<svg class="w-5 h-5 text-emerald-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>';
          } else if (type === 'error') {
            iconSvg = '<svg class="w-5 h-5 text-rose-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>';
          } else {
            iconSvg = '<svg class="w-5 h-5 text-blue-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>';
          }

          toast.innerHTML = `
            <div class="iatf-toast-icon">${iconSvg}</div>
            <div class="iatf-toast-content">
              <div class="iatf-toast-title">${title}</div>
              <div class="iatf-toast-msg">${strMsg}</div>
            </div>
            <button type="button" class="iatf-toast-close" title="Tutup">&times;</button>
            <div class="iatf-toast-bar"></div>
          `;

          container.appendChild(toast);

          let timer = setTimeout(() => {
            closeToast();
          }, 3500);

          function closeToast() {
            clearTimeout(timer);
            toast.classList.add('closing');
            setTimeout(() => {
              if (toast.parentNode) toast.parentNode.removeChild(toast);
            }, 250);
          }

          toast.querySelector('.iatf-toast-close').onclick = closeToast;
        };

        // Globally override native alert
        window.alert = function(msg) {
          window.showToast(msg);
        };
      })();

      /* --- 3. CUSTOM CONFIRMATION MODAL --- */
      (function() {
        window.customConfirm = function(options) {
          return new Promise(function(resolve) {
            let title = 'Konfirmasi Tindakan';
            let message = '';
            let confirmText = 'Hapus';
            let cancelText = 'Batal';
            let danger = true;

            if (typeof options === 'string') {
              message = options;
            } else if (options && typeof options === 'object') {
              title = options.title || title;
              message = options.message || '';
              confirmText = options.confirmText || confirmText;
              cancelText = options.cancelText || cancelText;
              danger = options.danger !== false;
            }

            const overlay = document.createElement('div');
            overlay.id = 'iatf-confirm-overlay';

            const iconSvg = danger ?
              '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>' :
              '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>';

            overlay.innerHTML = `
              <div class="iatf-confirm-backdrop"></div>
              <div class="iatf-confirm-box">
                <div class="iatf-confirm-icon ${danger ? 'danger' : 'info'}">${iconSvg}</div>
                <div class="iatf-confirm-body">
                  <h3 class="iatf-confirm-title">${title}</h3>
                  <p class="iatf-confirm-message">${message}</p>
                  <div class="iatf-confirm-actions">
                    <button type="button" class="iatf-btn-cancel">${cancelText}</button>
                    <button type="button" class="iatf-btn-confirm ${danger ? 'btn-danger' : 'btn-primary'}">${confirmText}</button>
                  </div>
                </div>
              </div>
            `;
            document.body.appendChild(overlay);

            function cleanup(result) {
              window.removeEventListener('keydown', onKey);
              overlay.classList.add('closing');
              setTimeout(() => { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 200);
              resolve(result);
            }

            function onKey(e) {
              if (e.key === 'Escape') cleanup(false);
              if (e.key === 'Enter') cleanup(true);
            }
            window.addEventListener('keydown', onKey);

            overlay.querySelector('.iatf-btn-cancel').onclick = () => cleanup(false);
            overlay.querySelector('.iatf-confirm-backdrop').onclick = () => cleanup(false);
            overlay.querySelector('.iatf-btn-confirm').onclick = () => cleanup(true);
          });
        };
      })();

      /* --- 4. GLOBAL KEYBOARD SHORTCUTS --- */
      (function() {
        window.addEventListener('keydown', function(e) {
          if ((e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')) {
            e.preventDefault();
            const searchInput = document.querySelector('input[placeholder*="Search"], input[placeholder*="Cari"], input[type="text"]');
            if (searchInput) {
              searchInput.focus();
              searchInput.select();
            }
          }
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'b') {
            e.preventDefault();
            const btn = document.getElementById('iatf-sidebar-toggle-btn');
            if (btn) btn.click();
          }
        });
      })();
    </script>
